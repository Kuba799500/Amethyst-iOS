name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios
    
    runs-on: macos-latest
    steps:
      - name: Remove work folders
        run: |
          echo "before"
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo "after"
          ls -lah ./
          
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo "::set-output name=sha::$(echo $(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*'))"
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false # use gl4es 1.1.5
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib
          
      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Fetch missing natives for unjailbroken iOS
        run: |
          mkdir -p Natives/resources/Frameworks
          
          # Stazeni JNA 5.17.0 a ziskani libjnidispatch
          curl -sLO https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar
          unzip -j jna-5.17.0.jar com/sun/jna/darwin-aarch64/libjnidispatch.jnilib -d Natives/resources/Frameworks/ || true
          if [ -f Natives/resources/Frameworks/libjnidispatch.jnilib ]; then
            mv Natives/resources/Frameworks/libjnidispatch.jnilib Natives/resources/Frameworks/libjnidispatch.dylib
          fi
          
          # Vytvoreni falesne iOS knihovny pro spvc aby hra nespadla pri nacitani
          echo "void dummy() {}" > dummy.c
          clang -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -o libspirv-cross.dylib dummy.c
          cp libspirv-cross.dylib Natives/resources/Frameworks/libspirv-cross.dylib
          cp libspirv-cross.dylib Natives/resources/Frameworks/liblwjgl_spvc.dylib
          
          # Stazeni lwjgl-spvc java trid, ktere Amethyst defaultne nema
          curl -sLO https://repo1.maven.org/maven2/org/lwjgl/lwjgl-spvc/3.3.3/lwjgl-spvc-3.3.3.jar
          mv lwjgl-spvc-3.3.3.jar JavaApp/libs/lwjgl/ || true
          
          rm -f jna-5.17.0.jar lwjgl-spvc-3.4.1-natives-macos-arm64.jar

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Build for ${{ matrix.platform_name }}
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          brew install make ldid
          export BOOTJDK=$JAVA_HOME/bin
          # Patch lwjgl-glfw.jar to include glfwPlatformSupported for Minecraft 1.21
          curl -sLO https://repo1.maven.org/maven2/org/javassist/javassist/3.29.2-GA/javassist-3.29.2-GA.jar
          cat << 'JAVAEOF' > Patcher.java
          import javassist.*;
          public class Patcher {
              public static void main(String[] args) throws Exception {
                  ClassPool pool = ClassPool.getDefault();
                  pool.insertClassPath("JavaApp/libs/lwjgl/lwjgl-glfw.jar");
                  CtClass cc = pool.get("org.lwjgl.glfw.GLFW");
                  try {
                      cc.getDeclaredMethod("glfwPlatformSupported");
                      System.out.println("Method already exists");
                  } catch (NotFoundException e) {
                      CtMethod m = CtNewMethod.make("public static boolean glfwPlatformSupported(int platform) { return platform == 0x00060001 || platform == 0x00060002; }", cc);
                      cc.addMethod(m);
                      cc.writeFile("patched");
                      System.out.println("Patched successfully");
                  }
              }
          }
JAVAEOF
          $JAVA_HOME/bin/javac -cp javassist-3.29.2-GA.jar Patcher.java
          $JAVA_HOME/bin/java -cp javassist-3.29.2-GA.jar:. Patcher
          if [ -d "patched" ]; then
            cd patched
            $JAVA_HOME/bin/jar uf ../JavaApp/libs/lwjgl/lwjgl-glfw.jar org/lwjgl/glfw/GLFW.class
            cd ..
          fi
          
          if [ "${{ matrix.platform_name }}" == "ios" ]; then
            # Build ipa and tipa for iOS
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
            
          elif [ "${{ matrix.platform_name }}" == "tvos" ]; then
            # Build tipa only for tvOS
            :
            
          else
            # Build ipa only for everything else
            gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=${{ matrix.platform }}
          fi

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-${{ matrix.platform_name }}.ipa
          path: artifacts/org.angelauramc.amethyst-*-${{ matrix.platform_name }}.ipa




      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@main
        if: matrix.platform_name == 'ios'
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
